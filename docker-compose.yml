version: '3.9'

services:
  backend:
    build: ./backend

  auth:
    build: ./auth

  frontend:
    build: ./frontend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data

  proxy:
    build: ./proxy
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
